services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: health_assistant
      MYSQL_USER: health
      MYSQL_PASSWORD: health
      MYSQL_ROOT_PASSWORD: root-health-dev
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./infra/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uhealth -phealth"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - ./infra/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-health-dev
    ports:
      - "${MINIO_API_HOST_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9003}:9001"
    volumes:
      - ./infra/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: mysql+asyncmy://health:health@mysql:3306/health_assistant
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minio
      OBJECT_STORAGE_SECRET_KEY: minio-health-dev
      OBJECT_STORAGE_BUCKET: health-reports
      OBJECT_STORAGE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      API_WORKERS: ${API_WORKERS:-1}
      PYTHONPATH: /app
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-1}"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./infra/data/chroma:/app/rag/chroma_db
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  worker:
    build:
      context: ./backend
      dockerfile: worker.Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: mysql+asyncmy://health:health@mysql:3306/health_assistant
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minio
      OBJECT_STORAGE_SECRET_KEY: minio-health-dev
      OBJECT_STORAGE_BUCKET: health-reports
      OBJECT_STORAGE_SECURE: "false"
      PYTHONPATH: /app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_HOST_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
